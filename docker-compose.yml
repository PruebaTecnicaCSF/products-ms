version: '3.8'

services:
  sqlserver:
    container_name: sqlserver_mvp
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    volumes:
      - mssql_data:/var/opt/mssql
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=MvpKardex2026!

volumes:
  mssql_data:
